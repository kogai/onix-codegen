# Temporary diagnostic, not part of the build. It only observes what
# editeur.org returns to a plain request from a CI runner, so that ADR-0003 can
# record facts instead of guesses. Manual trigger only; delete once it has run.
name: probe editeur
on: workflow_dispatch

jobs:
  probe:
    name: Probe editeur.org
    runs-on: ubuntu-latest
    steps:
      - name: Request the pages and archives
        run: |
          probe() {
            echo "=================================================="
            echo "URL: $1"
            curl -sS -L -o /tmp/body -D /tmp/head \
                 -w 'result: http=%{http_code} size=%{size_download} type=%{content_type} redirects=%{num_redirects}\n' \
                 "$1" || echo "curl exited $?"
            echo "--- response headers ---"
            cat /tmp/head || true
            echo "--- what did we actually get? ---"
            file /tmp/body || true
            head -c 400 /tmp/body | tr -d '\0' || true
            echo
          }

          probe "https://www.editeur.org/93/Release-3.0-and-3.1-Downloads/"
          probe "https://www.editeur.org/files/ONIX%202.1/ONIX_for_Books_Release2-1_rev03_schema+codes_Issue_36.zip"
          probe "https://www.editeur.org/files/ONIX%203/ONIX_BookProduct_XSD_schema+codes_Issue_52.zip"

          echo "=================================================="
          echo "zip links advertised on the download pages:"
          for page in \
            "https://www.editeur.org/93/Release-3.0-and-3.1-Downloads/" \
            "https://www.editeur.org/15/Archived-Previous-Releases/" ; do
            echo "--- $page"
            curl -sS -L "$page" | grep -oE 'href="[^"]*\.(zip|ZIP)"' | sort -u || true
          done
