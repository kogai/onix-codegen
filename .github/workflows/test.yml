name: test
on: [push]
jobs:
  test:
    name: Test haskell codes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: haskell-setup
        with:
          ghc-version: "8.8.3"
          enable-stack: true
          stack-version: "2.5.1"
      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ${{steps.haskell-setup.outputs.stack-path}}
            ~/.stack
            ./.stack-work/
          key: ${{ runner.os }}-${{ hashFiles('**/package.yaml') }}-${{ hashFiles('**/onix.cabal') }}-${{ hashFiles('**/stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-
      - run: make test
  e2e:
    name: Test e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ./node_modules
          key: ${{ runner.os }}-e2e-node24-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/go.sum') }}
          # Scoped to this job: a bare ${{ runner.os }}- prefix also matches the
          # Haskell job's cache, so this job could restore half a gigabyte of
          # ~/.stack and .stack-work that it has no use for.
          restore-keys: |
            ${{ runner.os }}-e2e-node24-
      - run: npm install
      - run: npx bazelisk test //e2e/go:snapshot_test
