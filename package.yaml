name: onix
version: 0.1.0.0
github: "githubuser/onix"
license: BSD3
author: "Author name here"
maintainer: "example@example.com"
copyright: "2020 Author name here"

extra-source-files:
  - README.md
  - ChangeLog.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/kogai/onix#readme>

dependencies:
  - base >= 4.7 && < 5

library:
  source-dirs: src
  ghc-options:
    - -Wall
  dependencies:
    - mustache
    - text
    - yaml
    - vector
    - xml-conduit
    - parsec
    - containers
    - transformers
    - bytestring
    - filepath
    - http-client-tls
    - http-client
    - network-uri

executables:
  onix-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Wall
    dependencies:
      - onix
      - optparse-applicative

tests:
  onix-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Wall
    dependencies:
      - onix
      - HUnit
      - vector
      - xml-conduit
      - text
      - containers
